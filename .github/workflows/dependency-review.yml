name: Dependency Review
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency Review
        # `continue-on-error` was removed: with it set, fail-on-severity below
        # was configured but inert, so a high-severity dependency could merge
        # while the check reported green. This now blocks. It requires the
        # Dependency graph to be enabled in Settings > Security & Analysis
        # (see #343) — a committed package-lock.json gives it something to
        # diff against.
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
