name: Tests

on:
  pull_request:
    branches: [main]

# Least privilege: this workflow only needs to read the code it tests.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26'
      # `npm ci --ignore-scripts`: install the reviewed, committed tree rather
      # than re-resolving floating ranges, and don't run dependency install
      # scripts on PR-branch code.
      - run: npm ci --ignore-scripts
      - run: node test-all.mjs --quick
