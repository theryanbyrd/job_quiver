name: Tests

on:
  pull_request:
    branches: [main]

# Least privilege: this workflow only needs to read the code it tests.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'
          cache: 'npm'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26'
      # `npm ci --ignore-scripts`: install the reviewed, committed tree rather
      # than re-resolving floating ranges, and don't run dependency install
      # scripts on PR-branch code.
      - run: npm ci --ignore-scripts
      - run: node test-all.mjs --quick
