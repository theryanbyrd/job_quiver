name: SBOM Generation
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          artifact-name: career-ops-sbom.spdx.json
          format: spdx-json
          output-file: career-ops-sbom.spdx.json

      - name: Upload SBOM to release
        # Event data goes through env, never interpolated straight into the
        # shell — `${{ }}` in a run: block is textual substitution, so a tag
        # carrying shell metacharacters would execute in a contents:write job.
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" career-ops-sbom.spdx.json
